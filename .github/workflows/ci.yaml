---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Action Workflows
        uses: eifinger/actionlint-action@e853378f1c2df78c76de61bede22dfb444ac33a7  # v1.5.0
      - uses: eifinger/setup-rye@e62d8930f186833fcc7b04b9f74549c01450a06b  # v3.0.2
        with:
          enable-cache: true
          cache-prefix: ${{ matrix.python-version }}
      - name: Pin python-version ${{ matrix.python-version }}
        run: rye pin ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          rye sync
      - name: Lint
        run: |
          SKIP=no-commit-to-branch rye run pre-commit run --all-files
